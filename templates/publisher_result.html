<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ export_name }} - Export DowFlow</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #fff; background: #0b0b0b; font-family: "Segoe UI", sans-serif; }
        main { width: min(680px, 100%); padding: 32px; border: 1px solid #4c382e; border-radius: 22px; background: #1a1411; }
        h1 { margin-top: 0; font-size: 1.6rem; }
        p { color: rgba(255,255,255,.7); line-height: 1.55; }
        code, pre { display: block; overflow-x: auto; padding: 14px; border-radius: 10px; color: #ffd2bd; background: #0d0a08; }
        a, button { display: inline-block; margin-top: 18px; border: 0; border-radius: 10px; padding: 11px 15px; color: #fff; background: #9c421f; text-decoration: none; cursor: pointer; font: inherit; }
        .secondary { margin-left: 8px; background: rgba(255,255,255,.12); }
    </style>
</head>
<body>
    <main>
        <h1>Export préparé : {{ export_name }}</h1>
        <p>Cette page concerne l’espace <strong>{{ export_scope }}</strong>. Le serveur doit rester lancé pour que le lien fonctionne.</p>
        <p>Adresse actuelle :</p>
        <code id="publicUrl">{{ public_url }}</code>
        <button type="button" onclick="navigator.clipboard.writeText(document.getElementById('publicUrl').textContent)">Copier le lien</button>
        <p>Pour créer une adresse publique avec {{ provider }} :</p>
        <pre>{{ tunnel_command }}</pre>
        <a href="{{ public_url }}">Ouvrir l’espace</a>
        <a class="secondary" href="/">Retour au menu</a>
    </main>
</body>
</html>
