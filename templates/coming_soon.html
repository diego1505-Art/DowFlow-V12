<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DowFlow - {{ label }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; display: grid; place-items: center;
            font-family: "Segoe UI", "Helvetica Neue", sans-serif; color: #fff;
            background: radial-gradient(circle at 30% 20%, #241a15 0%, #0a0a0a 70%);
            padding: 32px;
        }
        .card {
            width: min(620px, 100%); text-align: center; padding: 52px 40px;
            border-radius: 32px; border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
        }
        .category-code {
            color: #e99a72; font-size: 0.78rem; font-weight: 700;
            text-transform: uppercase;
        }
        h1 { margin-top: 18px; font-size: 1.9rem; font-weight: 800; }
        p { margin-top: 14px; color: rgba(255, 255, 255, 0.68); line-height: 1.6; }
        .badge {
            display: inline-block; margin-top: 24px; padding: 8px 16px; border-radius: 999px;
            background: rgba(201, 96, 52, 0.18); border: 1px solid rgba(201, 96, 52, 0.45);
            color: #ffb894; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700;
        }
        a.btn {
            display: inline-flex; align-items: center; gap: 8px; margin-top: 30px;
            padding: 14px 26px; border-radius: 14px; text-decoration: none; font-weight: 700;
            color: #fff; background: linear-gradient(135deg, #c96034, #8f3f1d);
            box-shadow: 0 12px 30px rgba(201, 96, 52, 0.35);
        }
        a.btn:hover { filter: brightness(1.08); }
    </style>
</head>
<body>
    <main class="card">
        <div class="category-code">{{ category }}</div>
        <h1>{{ label }}</h1>
        <p>{{ description }}</p>
        <p>Cet espace n'est pas encore disponible. Il arrive dans une prochaine mise à jour de DowFlow.</p>
        <span class="badge">Bientôt disponible</span>
        {% include "_publisher_export.html" %}
        <div><a class="btn" href="/">← Retour au menu</a></div>
    </main>
</body>
</html>
